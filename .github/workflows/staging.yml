# Staging deploy: every push to `main` (or a manual run) builds the app on GitHub and ships it to the
# Hostinger VPS over SSH, where deploy/remote-deploy.sh installs it as a new release under
# /srv/ecofy/releases/<sha>, points /srv/ecofy/current at it, reloads PM2 and checks /api/v1/health.
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Secrets   STAGING_SSH_KEY     private key of the `deploy` user on the VPS (ed25519, no passphrase)
#             STAGING_SSH_HOST    VPS public IP or hostname
#             STAGING_ENV_FILE    the complete .env for the server (see deploy/staging.env.example)
#   Variables STAGING_DOMAIN      sandbox-ecofy.itarang.com
#             STAGING_SSH_USER    deploy   (optional, default deploy)
#             STAGING_SSH_PORT    22       (optional, default 22)
name: staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time, so they are taken from the
      # same env file the server will run with. DATABASE_URL is also needed because `next build` evaluates
      # route modules (src/core/db/client.ts parses config at import) while collecting page data; it has no
      # NEXT_PUBLIC_ prefix, so it never reaches the browser bundle. Nothing else from the file is used here.
      # The secret may hold the plain file or its single-line base64 encoding.
      - name: Build-time env
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          if [ -z "$STAGING_ENV_FILE" ]; then
            echo "::error::Secret STAGING_ENV_FILE is not set (plain or base64 .env, see deploy/staging.env.example)"
            exit 1
          fi
          if ! bash deploy/decode-env.sh "$STAGING_ENV_FILE" > server.env; then
            echo "::error::STAGING_ENV_FILE could not be read as a .env file or its base64 encoding"
            rm -f server.env
            exit 1
          fi
          if ! grep -E '^NEXT_PUBLIC_[A-Z0-9_]+=' server.env >> "$GITHUB_ENV"; then
            echo "::error::STAGING_ENV_FILE decoded, but has no NEXT_PUBLIC_* lines (re-create the secret from staging.env or its base64)"
            rm -f server.env
            exit 1
          fi
          db_line=$(grep -E '^DATABASE_URL=.' server.env | tail -n 1 || true)
          if [ -z "$db_line" ]; then
            echo "::error::DATABASE_URL is missing from STAGING_ENV_FILE"
            rm -f server.env
            exit 1
          fi
          case "$db_line" in *"<"*">"*)
            echo "::error::DATABASE_URL in STAGING_ENV_FILE still holds a <placeholder> from staging.env.example"
            rm -f server.env
            exit 1;;
          esac
          echo "::add-mask::${db_line#DATABASE_URL=}"
          echo "$db_line" >> "$GITHUB_ENV"
          rm -f server.env

      - name: Build (standalone)
        env:
          GITHUB_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Package release
        run: |
          tar -czf release.tgz \
            .next/standalone .next/static \
            public src db scripts deploy \
            package.json package-lock.json ecosystem.config.cjs \
            next.config.ts tsconfig.json tsconfig.check.json postcss.config.mjs
          ls -lh release.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 7

  deploy:
    name: Deploy to ${{ vars.STAGING_DOMAIN || 'staging' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    env:
      SSH_USER: ${{ vars.STAGING_SSH_USER || 'deploy' }}
      SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
      SHA: ${{ github.sha }}
    steps:
      - name: Preflight
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          missing=""
          [ -n "$STAGING_SSH_KEY" ]  || missing="$missing STAGING_SSH_KEY"
          [ -n "$SSH_HOST" ]         || missing="$missing STAGING_SSH_HOST"
          [ -n "$STAGING_ENV_FILE" ] || missing="$missing STAGING_ENV_FILE"
          [ -n "$DOMAIN" ]           || missing="$missing STAGING_DOMAIN(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets/variables:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: SSH key
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        # The secret may hold the private key file as-is or its single-line base64 encoding. Windows line
        # endings (CRLF from copying the key off a terminal) make OpenSSH fail with "error in libcrypto".
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          key="$(printf '%s' "$STAGING_SSH_KEY" | tr -d '\r')"
          case "$key" in ssh-ed25519*|ssh-rsa*|ecdsa-*|*"PUBLIC KEY"*)
            echo "::error::STAGING_SSH_KEY holds a PUBLIC key; paste the private key (/home/deploy/.ssh/github_actions, incl. BEGIN/END lines)"; exit 1;;
          esac
          if ! printf '%s' "$key" | grep -q -- '-----BEGIN'; then
            body="$(printf '%s' "$key" | tr -d '[:space:]')"
            if [ "$(printf '%s' "$body" | base64 -d 2>/dev/null | head -c 14 | tr -d '\0')" = "openssh-key-v1" ]; then
              # Only the body of an OpenSSH key was pasted (BEGIN/END lines missing): rebuild the file.
              key="$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----' "$(printf '%s' "$body" | fold -w 70)")"
            else
              key="$(printf '%s' "$body" | base64 -d 2>/dev/null | tr -d '\r\0' || true)"
            fi
          fi
          case "$key" in *"-----BEGIN"*"PRIVATE KEY-----"*) ;;
            *) echo "::error::STAGING_SSH_KEY is not a private key (expected the whole file incl. -----BEGIN/END ... PRIVATE KEY----- lines)"; exit 1;;
          esac
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2>/dev/null; then
            echo "::error::STAGING_SSH_KEY cannot be loaded (truncated, has a passphrase, or line breaks were lost when pasting)"
            exit 1
          fi
          echo "Using key: $(ssh-keygen -lf ~/.ssh/id_ed25519.pub)"
          printf 'Host *\n  IdentitiesOnly yes\n  BatchMode yes\n' > ~/.ssh/config
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release
        run: scp -P "$SSH_PORT" release.tgz "$SSH_USER@$SSH_HOST:/srv/ecofy/releases/$SHA.tgz"

      - name: Write server .env
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          bash deploy/decode-env.sh "$STAGING_ENV_FILE" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && mkdir -p /srv/ecofy/shared && cat > /srv/ecofy/shared/.env.new && mv /srv/ecofy/shared/.env.new /srv/ecofy/shared/.env'

      - name: Install release, reload PM2, health check
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p /srv/ecofy/releases/$SHA \
             && tar -xzf /srv/ecofy/releases/$SHA.tgz -C /srv/ecofy/releases/$SHA deploy/remote-deploy.sh \
             && bash /srv/ecofy/releases/$SHA/deploy/remote-deploy.sh $SHA $DOMAIN"

      - name: Smoke test over HTTPS
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://$DOMAIN/api/v1/health"; then echo; echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "::error::https://$DOMAIN/api/v1/health did not answer 200"
          exit 1
